<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bit-lite</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #1b1f24;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
      }
      #app {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }
      aside {
        background: #fff;
        border-right: 1px solid #d9dee7;
        padding: 18px 14px;
      }
      h1 {
        margin: 0 8px 18px;
        font-size: 16px;
      }
      .group {
        margin: 0 0 18px;
      }
      .group-title {
        color: #667085;
        font-size: 12px;
        margin: 0 8px 6px;
      }
      a {
        display: inline-flex;
        color: #343b45;
        text-decoration: none;
        border-radius: 7px;
        padding: 7px 9px;
        font-size: 14px;
      }
      a:hover, a.active {
        background: #edf1f7;
        color: #111827;
      }
      iframe {
        width: 100%;
        height: 100vh;
        border: 0;
        background: #fff;
      }
      .component-row {
        display: grid;
        gap: 4px;
        margin: 0 0 8px;
      }
      .component-name {
        color: #111827;
        font-size: 14px;
        padding: 0 8px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 0 0 2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <h1 id="title">bit-lite</h1>
        <nav id="nav"></nav>
      </aside>
      <iframe id="frame" title="preview"></iframe>
    </div>
    <script type="module">
      const nav = document.querySelector("#nav");
      const frame = document.querySelector("#frame");
      const title = document.querySelector("#title");
      const params = new URLSearchParams(location.search);
      const selected = params.get("component");
      const selectedView = params.get("view");
      const registry = await fetch("/api/previews").then((res) => res.json());
      title.textContent = registry.title ?? "bit-lite";

      let firstHref;
      for (const env of registry.envs) {
        const group = document.createElement("section");
        group.className = "group";
        group.innerHTML = '<div class="group-title">' + env.envName + ' / ' + env.vendor + '</div>';
        for (const component of env.components) {
          const row = document.createElement("div");
          row.className = "component-row";
          row.innerHTML = '<div class="component-name">' + component.id + '</div>';
          const actions = document.createElement("div");
          actions.className = "actions";
          row.appendChild(actions);
          for (const view of component.views) {
            actions.appendChild(createAction(component, view));
          }
          group.appendChild(row);
        }
        nav.appendChild(group);
      }
      if (!frame.src && firstHref) frame.src = firstHref;

      function createAction(component, view) {
        firstHref ??= view.url;
        const link = document.createElement("a");
        link.href = "?component=" + encodeURIComponent(component.id) + "&view=" + encodeURIComponent(view.type);
        link.textContent = view.label;
        link.className =
          component.id === selected && (selectedView ?? component.views[0]?.type) === view.type ? "active" : "";
        link.addEventListener("click", (event) => {
          event.preventDefault();
          history.pushState(null, "", link.href);
          document.querySelectorAll("a").forEach((item) => item.classList.remove("active"));
          link.classList.add("active");
          frame.src = view.url;
        });
        if (component.id === selected && (selectedView ?? component.views[0]?.type) === view.type) frame.src = view.url;
        return link;
      }
    </script>
  </body>
</html>
