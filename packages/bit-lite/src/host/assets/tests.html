<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bit-lite tests</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #1b1f24;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
      }
      main {
        min-height: 100vh;
        padding: 28px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 18px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      .status {
        border: 1px solid #cfd6e1;
        border-radius: 999px;
        padding: 4px 10px;
        color: #3d4654;
        background: #f9fafb;
        font-size: 12px;
      }
      pre {
        min-height: 420px;
        overflow: auto;
        margin: 0;
        border-radius: 8px;
        background: #111827;
        color: #f9fafb;
        padding: 16px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tests</h1>
        <div class="status" id="status">loading</div>
      </header>
      <pre id="output">Loading test results...</pre>
    </main>
    <script type="module">
      const status = document.querySelector("#status");
      const output = document.querySelector("#output");
      const envName = new URLSearchParams(location.search).get("env");

      async function refresh() {
        const url = envName ? "/api/tests?env=" + encodeURIComponent(envName) : "/api/tests";
        const result = await fetch(url).then((res) => res.json());
        status.textContent =
          (result.envName ? result.envName + " / " : "") +
          result.status +
          (result.exitCode === undefined ? "" : " / " + result.exitCode);
        output.textContent = result.output || "No test output yet.";
      }

      await refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
