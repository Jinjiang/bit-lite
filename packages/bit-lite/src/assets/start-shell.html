<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bit-lite start</title>
    <style>
      body { margin: 0; background: #f8fafc; color: #111827; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: min(1120px, calc(100vw - 32px)); margin: 0 auto; padding: 32px 0 48px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: 28px; }
      .origin, .empty { color: #4b5563; }
      .env { margin: 14px 0; overflow: hidden; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; }
      .env-head { padding: 14px 16px; font-weight: 700; background: #f3f4f6; border-bottom: 1px solid #d1d5db; }
      .component { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 16px; border-top: 1px solid #e5e7eb; }
      .component:first-child { border-top: 0; }
      .component-id { overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: end; }
      a { color: #0f766e; font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .status { padding: 2px 7px; color: #374151; background: #e5e7eb; border-radius: 999px; font-size: 12px; }
      .empty { padding: 18px 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>bit-lite start</h1>
          <div class="origin" id="origin"></div>
        </div>
        <a href="/__bit-lite/manifest.json">manifest</a>
      </header>
      <section id="app" class="empty">Loading start manifest...</section>
    </main>
    <script>
      const app = document.getElementById("app");
      const origin = document.getElementById("origin");

      async function refresh() {
        const response = await fetch("/__bit-lite/manifest.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`Manifest request failed (${response.status})`);
        const manifest = await response.json();
        render(manifest);
        setTimeout(() => refresh().catch(renderError), 1500);
      }

      function render(manifest) {
        origin.textContent = manifest.proxy.origin;
        app.className = "";
        const byEnv = new Map();
        for (const component of manifest.components) {
          const key = JSON.stringify([component.env.packageName, component.env.requestedVersion]);
          const group = byEnv.get(key) || { env: component.env, components: [] };
          group.components.push(component);
          byEnv.set(key, group);
        }
        const envs = Array.from(byEnv.values(), ({ env, components }) => renderEnv(env, components));
        app.replaceChildren(...(envs.length ? envs : [element("div", "No start components are running.", "empty")]));
      }

      function renderEnv(env, components) {
        const article = element("article", "", "env");
        article.append(element("div", `${env.packageName}@${env.requestedVersion} (installed ${env.installedVersion})`, "env-head"));
        for (const component of components) article.append(renderComponent(component));
        return article;
      }

      function renderComponent(component) {
        const row = element("div", "", "component");
        row.append(element("span", component.componentId, "component-id"));
        const links = element("span", "", "links");
        links.append(link("source", component.source.route));
        if (component.preview) {
          links.append(link("overview", component.preview.overviewRoute));
          if (component.preview.docsRoute) links.append(link("docs", component.preview.docsRoute));
          for (const composition of component.preview.compositions) links.append(link(composition.name, composition.route));
        }
        if (component.test) {
          links.append(link("tests", component.test.route));
          links.append(element("span", component.test.status, "status"));
        }
        row.append(links);
        return row;
      }

      function link(text, href) {
        const node = element("a", text);
        node.href = href;
        return node;
      }

      function element(tag, text, className = "") {
        const node = document.createElement(tag);
        node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      function renderError(error) {
        app.textContent = error instanceof Error ? error.message : String(error);
        app.className = "empty";
      }

      refresh().catch(renderError);
    </script>
  </body>
</html>
