<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="1">
    <title>{{TITLE}}</title>
    <style>
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #f8fafc;
        color: #111827;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(560px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{TITLE}}</h1>
      <p>{{MESSAGE}}</p>
    </main>
  </body>
</html>
